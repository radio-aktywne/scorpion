# Python version to target
target-version = "py314"

select = [
  # Enable all rules
  "ALL",
]

ignore = [
  # Disable rules that might conflict with the formatter
  "COM812",
  "COM819",
  "D203",
  "D206",
  "D213",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",

  # Disable rules that are too strict
  "ANN401",
  "ARG",
  "ASYNC109",
  "B024",
  "CPY",
  "D100",
  "D104",
  "D105",
  "D106",
  "D107",
  "DTZ",
  "EM101",
  "EM102",
  "ERA001",
  "PLR1711",
  "PLW0108",
  "RET501",
  "S104",
  "TC001",
  "TC002",
  "TC003",
  "TC006",
  "TRY003",
]

[lint.isort]
# Combine import aliases
combine-as-imports = true

# Force 2 blank lines after imports
lines-after-imports = 2

[lint.pylint]
# Increase limits
max-args = 10
max-bool-expr = 10
max-positional-args = 10
